name: Brain message relay tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dedicated Council notifier tests
        run: python -m unittest discover -s tests -p 'test_notify.py' -v
      - name: Validate source syntax
        run: python -m compileall -q brain council archivist host
