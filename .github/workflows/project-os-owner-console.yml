name: Project OS Owner Console
on:
  pull_request:
    paths:
      - 'host/owner_console.py'
      - 'tests/test_owner_console.py'
      - '.github/workflows/project-os-owner-console.yml'
  push:
    branches: [main]
    paths:
      - 'host/owner_console.py'
      - 'tests/test_owner_console.py'
jobs:
  owner-console-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_owner_console.py' -v
